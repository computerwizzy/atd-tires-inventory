name: ATD Inventory Sync

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Run Sync
        env:
          ATD_FTP_HOST: ${{ secrets.ATD_FTP_HOST }}
          ATD_FTP_USER: ${{ secrets.ATD_FTP_USER }}
          ATD_FTP_PASS: ${{ secrets.ATD_FTP_PASS }}
          ATD_FTP_DIR: ${{ secrets.ATD_FTP_DIR }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python scripts/sync_atd_qty_only.py
